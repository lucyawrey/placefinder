[package]
name = "client"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "placefinder"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bevy = "0.20.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
motor = { version = "0.1.0", path = "../motor" }
place = { version = "0.1.0", path = "../place" }
rmcp = { version = "3.11.0", features = ["transport-streamable-http-server"] }
tokio = { version = "1.54.1", features = ["rt", "net", "sync", "time"] }

[build-dependencies]
winresource = "0.1.34"

[package.metadata.packager]
product-name = "Placefinder"
identifier = "dev.placefinder.client"
binaries = [{ path = "placefinder", main = true }]
icons = ["icons/icon.png"]
resources = ["../../LICENSE", "../../target/release/THIRD-PARTY-NOTICES.html"]

[package.metadata.packager.appimage]
# The build machine's libwayland-client stops newer hosts' Vulkan drivers from finding the GPU.
excluded-libraries = ["libwayland-client*"]

[package.metadata.packager.nsis]
installer-icon = "icons/icon.ico"
# The log folder sits inside the per-user install folder, which the uninstaller otherwise leaves behind.
appdata-paths = ["$LOCALAPPDATA/$PRODUCTNAME"]

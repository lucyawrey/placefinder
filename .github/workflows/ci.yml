name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          # Self-hosted on a maintainer's Mac, so it waits while that machine is off.
          - [self-hosted, macOS]
    runs-on: ${{ matrix.runner }}
    env:
      # Check is private: fetch it with a read-only token, set for this job only.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.CHECK_TOKEN }}@github.com/lucyawrey/check.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/lucyawrey/check
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p place --target wasm32-unknown-unknown

name: Pages

on:
  push:
    branches: [main]
    paths: [places/**, site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Put the site beside the home Place
        run: |
          mkdir _site
          cp -r places/. _site/
          for file in $(cd site && find . -type f); do
            if [ -e "_site/$file" ]; then
              echo "site/$file would overwrite places/$file"
              exit 1
            fi
          done
          cp -r site/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
